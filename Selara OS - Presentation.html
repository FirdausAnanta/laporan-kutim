<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Selara OS | Program · Acara Puncak · Publikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --night: #1d1d1f;
            --blue: #0071e3;
            --foam: #f5f5f7;
            --ink: #1d1d1f;
            --paper: #ffffff;
            --line: #d2d2d7;
            --muted: #6e6e73;
            --surface: #f5f5f7;
            --selection: #e5e5ea;
            --accent-program: #0071e3;
            --accent-puncak: #f59e0b;
            --accent-publikasi: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Google Sans", "Product Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 3px solid #0071e3;
            outline-offset: 3px;
        }

        /* Photographic Desktop Wallpaper */
        .desktop {
            position: relative;
            isolation: isolate;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: var(--ink);
            background: #1d1d1f url('Rapat%20Koordinasi%20FL%20Kutai%20Timur.jpg') no-repeat center center / cover;
        }

        .desktop::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 1;
        }

        /* macOS Menu Bar */
        .bar {
            position: relative;
            z-index: 50;
            height: 38px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            color: var(--ink);
            font-size: 13px;
        }

        .brand-identity {
            display: inline-flex;
            align-items: center;
            height: 100%;
        }

        .brand-logo {
            display: block;
            height: 22px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
        }

        .bar .spacer {
            flex: 1;
        }

        .screen-control {
            padding: 4px 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #ffffff;
            color: var(--ink);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all .15s ease;
        }

        .screen-control:hover:not(:disabled) {
            background: var(--selection);
            border-color: #a1a1a6;
        }

        .screen-control:disabled {
            color: #a1a1a6;
            border-color: #e5e5ea;
            cursor: default;
        }

        .clock {
            font-weight: 500;
            font-feature-settings: "tnum";
            color: #3a3a3c;
        }

        /* macOS Floating Dock with 3 Apps */
        .dock {
            position: fixed;
            z-index: 90;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            width: max-content;
            max-width: calc(100% - 28px);
            padding: 10px 14px;
            overflow: visible;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(32px) saturate(190%);
        }

        .app-hover-zone {
            position: relative;
            display: grid;
            flex: none;
            width: 54px;
            height: 54px;
            place-items: center;
        }

        .app-hover-zone::before {
            content: "";
            position: absolute;
            z-index: 0;
            top: -26px;
            right: 0;
            bottom: 0;
            left: 0;
        }

        .app-hover-zone:hover {
            z-index: 2;
        }

        .app {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            padding: 0;
            border: 0;
            border-radius: 14px;
            color: #ffffff;
            cursor: pointer;
            transform-origin: center bottom;
            transition: transform .2s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow .2s ease;
        }

        .app.program {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .app.puncak {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .app.publikasi {
            background: linear-gradient(145deg, #10b981, #059669);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .app svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .app-hover-zone:hover .app,
        .app:focus-visible {
            transform: translateY(-16px) scale(1.15);
        }

        .app::after {
            content: attr(aria-label);
            position: absolute;
            bottom: calc(100% + 14px);
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(29, 29, 31, 0.94);
            color: #ffffff;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.01em;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            transform: translateY(4px);
            transition: opacity .15s ease, transform .15s ease;
        }

        .app-hover-zone:hover .app::after {
            opacity: 1;
            transform: translateY(0);
        }

        .dock-indicator {
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #1d1d1f;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity .18s ease;
        }

        .app.is-open .dock-indicator {
            opacity: 1;
        }

        .divider {
            width: 1px;
            height: 40px;
            background: rgba(0, 0, 0, 0.12);
            margin: 0 2px;
        }

        /* Dock Stack for Minimized Windows */
        .dock-stack {
            position: relative;
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            background: rgba(245, 245, 247, 0.9);
            color: var(--ink);
            cursor: pointer;
            transition: transform .18s ease, background .18s ease;
        }

        .dock-stack:hover {
            transform: translateY(-8px) scale(1.08);
            background: #e5e5ea;
        }

        .dock-stack-glyph {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }

        .dock-stack-glyph i {
            display: block;
            width: 20px;
            height: 4px;
            border-radius: 2px;
            background: #6e6e73;
        }

        .dock-stack-count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 9px;
            background: #0071e3;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            display: grid;
            place-items: center;
            line-height: 1;
        }

        .dock-stack-count:empty {
            display: none;
        }

        .dock-fan {
            position: absolute;
            bottom: calc(100% + 14px);
            right: 0;
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(20px);
            z-index: 20;
            min-width: 180px;
        }

        .dock-fan.open {
            display: flex;
        }

        .dock-window {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            transition: background .12s ease;
        }

        .dock-window:hover {
            background: #e5e5ea;
        }

        /* Window System */
        .window {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: calc(38px + (100vh - 38px - 94px) / 2);
            display: none;
            flex-direction: column;
            width: min(1220px, calc(100vw - 48px));
            height: min(760px, calc(100vh - 148px));
            max-height: calc(100vh - 148px);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 16px;
            background: #ffffff;
            color: var(--ink);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translate(-50%, -50%);
            animation: windowPop .22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes windowPop {
            from {
                opacity: 0;
                transform: translate(-50%, -46%) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .window.open {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            grid-template-rows: 48px minmax(0, 1fr);
        }

        .window.screen-expanded {
            position: fixed;
            z-index: 20;
            inset: 0;
            width: 100%;
            height: 100%;
            max-height: none;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            transform: none;
        }

        .window:fullscreen {
            width: 100%;
            height: 100%;
            max-height: none;
            border: 0;
            border-radius: 0;
        }

        .window-top {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            height: 48px;
            flex: none;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            background: #fbfbfd;
            user-select: none;
        }

        .traffic {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .traffic button {
            width: 13px;
            height: 13px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity .12s ease;
        }

        .traffic .close {
            background: #ff5f57;
        }

        .traffic .minimize {
            background: #febc2e;
        }

        .traffic .fullscreen {
            background: #28c840;
        }

        .traffic button:hover {
            filter: brightness(0.9);
        }

        .window-title {
            margin: auto;
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Sidebar Tabs */
        .tab-list {
            padding: 18px 12px;
            border-right: 1px solid var(--line);
            background: #fbfbfd;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .tab {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #4b4b4e;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            font-weight: 550;
            transition: all .12s ease;
        }

        .tab:hover {
            background: #efeff2;
            color: #1d1d1f;
        }

        .tab[aria-selected="true"] {
            background: #e5e5ea;
            color: #1d1d1f;
            font-weight: 650;
        }

        .tab-mark {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.05);
            color: #6e6e73;
            font-size: 11px;
            font-weight: 700;
            flex: none;
        }

        .tab[aria-selected="true"] .tab-mark {
            background: #0071e3;
            color: #ffffff;
        }

        /* Workspace Content Area */
        .workspace-content {
            display: grid;
            grid-template-columns: minmax(360px, 1.15fr) minmax(320px, 0.85fr);
            gap: 48px;
            overflow-y: auto;
            padding: 44px;
            background: #ffffff;
        }

        .workspace-content.full-width {
            grid-template-columns: minmax(0, 1fr);
        }

        .kicker {
            color: #0071e3;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: clamp(28px, 3.2vw, 42px);
            letter-spacing: -.04em;
            line-height: 1.15;
            color: #111111;
        }

        .lead {
            font-size: 16px;
            line-height: 1.6;
            color: #48484a;
            margin: 0 0 24px;
        }

        .workspace-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 20px 0 28px;
            padding: 16px;
            border-radius: 12px;
            background: #f5f5f7;
            border: 1px solid #e5e5ea;
        }

        .workspace-meta div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .workspace-meta span {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .workspace-meta b {
            font-size: 14px;
            font-weight: 700;
            color: #1d1d1f;
        }

        /* Product & Feature Lists */
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feature-item {
            display: flex;
            gap: 14px;
            padding: 16px;
            border-radius: 12px;
            background: #fbfbfd;
            border: 1px solid #e5e5ea;
            transition: transform .15s ease, border-color .15s ease;
        }

        .feature-item:hover {
            border-color: #d2d2d7;
            transform: translateY(-2px);
        }

        .feature-item-index {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #0071e3;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            flex: none;
        }

        .feature-item-body h3 {
            margin: 0 0 4px;
            font-size: 15px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .feature-item-body p {
            margin: 0;
            font-size: 13.5px;
            line-height: 1.5;
            color: #555558;
        }

        /* Scorecards & Metrics */
        .scorecard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .scorecard {
            padding: 18px 16px;
            border-radius: 12px;
            background: #f5f5f7;
            border: 1px solid #e5e5ea;
        }

        .scorecard strong {
            display: block;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -.04em;
            color: #0071e3;
            line-height: 1.1;
        }

        .scorecard span {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #6e6e73;
        }

        .metric-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fbfbfd;
            border: 1px solid #e5e5ea;
        }

        .metric-row span {
            font-size: 13px;
            color: #555558;
        }

        .metric-row strong {
            font-size: 14px;
            font-weight: 700;
            color: #111;
        }

        /* Comparison cases */
        .compare-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .compare-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e5ea;
        }

        .compare-panel {
            padding: 16px;
        }

        .compare-panel.before {
            background: #fbfbfd;
            border-right: 1px solid #e5e5ea;
        }

        .compare-panel.after {
            background: #ffffff;
        }

        .compare-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .compare-panel.before .compare-status {
            color: #ef4444;
        }

        .compare-panel.after .compare-status {
            color: #10b981;
        }

        .compare-panel p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #48484a;
        }

        /* Evidence / Visual Gallery */
        .evidence-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .evidence-stage {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e5ea;
            background: #000000;
        }

        .evidence-stage img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
        }

        .evidence-caption {
            padding: 12px 14px;
            background: #f5f5f7;
            font-size: 12px;
            color: #555558;
            border-top: 1px solid #e5e5ea;
        }

        .evidence-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .evidence-thumb {
            width: 64px;
            height: 48px;
            flex: none;
            padding: 0;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: #e5e5ea;
        }

        .evidence-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .evidence-thumb[aria-selected="true"] {
            border-color: #0071e3;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .window.open {
                grid-template-columns: 1fr;
                grid-template-rows: 48px auto 1fr;
            }

            .tab-list {
                flex-direction: row;
                overflow-x: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
                padding: 10px 14px;
            }

            .tab {
                white-space: nowrap;
                width: auto;
            }

            .workspace-content {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 28px;
            }

            .compare-card {
                grid-template-columns: 1fr;
            }

            .compare-panel.before {
                border-right: 0;
                border-bottom: 1px solid #e5e5ea;
            }
        }
    </style>
</head>

<body>
    <main class="desktop">
        <!-- macOS Top Navigation Bar -->
        <header class="bar">
            <div class="brand-identity">
                <img class="brand-logo" src="assets/nyalanesia-brand-logo.png" alt="Nyalanesia" height="24">
            </div>
            <button class="screen-control" id="enter-fullscreen" type="button">Fullscreen</button>
            <button class="screen-control" id="exit-fullscreen" type="button" disabled>Normal Screen</button>
            <span class="spacer"></span>
            <span class="clock" id="clock"></span>
        </header>

        <!-- Clean White Plain Desktop Background (No folders, no decorations) -->

        <!-- macOS Floating Dock: Exactly 3 Apps -->
        <nav class="dock" aria-label="Aplikasi Selara OS">
            <span class="app-hover-zone">
                <button class="app program" id="dock-btn-program" aria-label="Program" data-target="window-program" type="button">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <rect x="5" y="4" width="22" height="24" rx="4" />
                        <path d="M10 2v4M22 2v4M5 10h22M10 16h6M10 21h12" />
                    </svg>
                    <span class="dock-indicator" aria-hidden="true"></span>
                </button>
            </span>
            <span class="app-hover-zone">
                <button class="app puncak" id="dock-btn-puncak" aria-label="Acara Puncak" data-target="window-acara-puncak" type="button">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <path d="M8 5h16v8a8 8 0 0 1-16 0V5z" />
                        <path d="M5 8h3v4a5 5 0 0 1-3-4zM24 12V8h3a5 5 0 0 1-3 4zM16 21v5M10 26h12" />
                    </svg>
                    <span class="dock-indicator" aria-hidden="true"></span>
                </button>
            </span>
            <span class="app-hover-zone">
                <button class="app publikasi" id="dock-btn-publikasi" aria-label="Publikasi" data-target="window-publikasi" type="button">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 0-2.5 2.5z" />
                        <path d="M6 22h14v6H6.5A2.5 2.5 0 0 1 4 25.5V25" />
                        <path d="M20 6h6a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H6" />
                    </svg>
                    <span class="dock-indicator" aria-hidden="true"></span>
                </button>

                weekday: 'long',
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            }).format(new Date()).replace(',', ' ·');

            const count = dockFan.children.length;
            dockStackCount.textContent = count ? String(count) : '';

            dockStack.setAttribute('aria-expanded', String(dockFan.classList.contains('open')));
            if (!count) dockFan.classList.remove('open');
        }

        function removeDockWindow(windowId) {
            dockFan.querySelector(`[data-restore-window="${windowId}"]`)?.remove();
            syncDockStack();
        }

        function addDockWindow(windowEl) {
            const windowId = windowEl.id;
            let item = dockFan.querySelector(`[data-restore-window="${windowId}"]`);
            if (!item) {
                item = document.createElement('button');
                item.type = 'button';
                item.className = 'dock-window';
                item.dataset.restoreWindow = windowId;
                item.innerHTML = `<span>●</span> <span class="dock-window-label"></span>`;
                item.addEventListener('click', () => {
                    windowEl.classList.remove('minimized');
                    windowEl.classList.add('open');
                    removeDockWindow(windowId);
                    syncDockIndicators();
                    windowEl.querySelector('.close').focus();
                });
                dockFan.appendChild(item);
            }
            const title = windowEl.querySelector('.window-title').textContent.trim();
            item.querySelector('.dock-window-label').textContent = title;
            dockFan.classList.add('open');
            syncDockStack();
            syncDockIndicators();
        }

                const targetId = app.dataset.target;
                const win = document.getElementById(targetId);
                const isOpen = win && win.classList.contains('open');
                app.classList.toggle('is-open', Boolean(isOpen));
            });

                if (w.id !== id) {

                }
            });

            if (!targetWin) return;
            targetWin.classList.remove('minimized');
            removeDockWindow(id);
            targetWin.classList.add('open');
            syncDockIndicators();
            targetWin.querySelector('.close')?.focus();
        }

        /* Renderer for Workspace Windows */
        function renderWindowContent(windowId, tabKey) {
            let dataPackage, contentContainer;
            if (windowId === 'window-program') {
                dataPackage = programData;
                contentContainer = document.getElementById('program-content');
            } else if (windowId === 'window-acara-puncak') {
                dataPackage = puncakData;
                contentContainer = document.getElementById('puncak-content');
            } else if (windowId === 'window-publikasi') {
                dataPackage = publikasiData;
                contentContainer = document.getElementById('publikasi-content');
            }
            if (!dataPackage || !contentContainer) return;

            const page = dataPackage[tabKey] || dataPackage[Object.keys(dataPackage)[0]];
            const isFullWidth = !page.aside;
            contentContainer.className = `workspace-content ${isFullWidth ? 'full-width' : ''}`;

            let metaHtml = '';
            if (page.meta && page.meta.length) {
                metaHtml = `<div class="workspace-meta">${page.meta.map(m => `<div><span>${m[0]}</span><b>${m[1]}</b></div>`).join('')}</div>`;
            }

            contentContainer.innerHTML = `
                <article class="workspace-copy">
                    <div class="kicker">${page.kicker || ''}</div>
                    <h2>${page.title || ''}</h2>
                    <p class="lead">${page.lead || ''}</p>
                    ${metaHtml}
                    ${page.body || ''}
                </article>
                ${page.aside ? `<aside class="workspace-aside">${page.aside}</aside>` : ''}
            `;
            contentContainer.scrollTop = 0;
        }

        /* Event Listeners Setup */
        dockApps.forEach(app => {
            app.addEventListener('click', () => {
                const targetWindowId = app.dataset.target;
                openWindow(targetWindowId, app);
            });
        });

        // Window Controls
        windows.forEach(win => {
            const windowId = win.id;

            // Close button
            win.querySelector('.close')?.addEventListener('click', () => closeWindow(win));

            // Minimize button
            win.querySelector('.minimize')?.addEventListener('click', (e) => {
                e.stopPropagation();
                win.classList.remove('screen-expanded', 'open');
                win.classList.add('minimized');
                addDockWindow(win);
            });

            // Fullscreen toggle button
            win.querySelector('.fullscreen')?.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (document.fullscreenElement === win) {
                    await document.exitFullscreen();
                    return;
                }
                win.classList.toggle('screen-expanded');
            });

            // Tabs inside the window
            win.querySelectorAll('.tab').forEach(tabButton => {
                tabButton.addEventListener('click', () => {
                    win.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', 'false'));
                    tabButton.setAttribute('aria-selected', 'true');
                    const tabKey = tabButton.dataset.tab;
                    renderWindowContent(windowId, tabKey);
                });
            });

            // Initial render of first tab
            const firstTab = win.querySelector('.tab');
            if (firstTab) {
                renderWindowContent(windowId, firstTab.dataset.tab);
            }
        });

        // Dock Stack fan toggle
        dockStack.addEventListener('click', () => {
            if (!dockFan.children.length) return;
            dockFan.classList.toggle('open');
            syncDockStack();
        });

        document.addEventListener('pointerdown', (e) => {
            if (!dockFan.contains(e.target) && !dockStack.contains(e.target)) {
                dockFan.classList.remove('open');
                syncDockStack();
            }
        });

        // OS Screen Controls
        const enterFullscreen = document.getElementById('enter-fullscreen');
        const exitFullscreen = document.getElementById('exit-fullscreen');
        function syncOSScreenControls() {
            const isFull = Boolean(document.fullscreenElement);
            enterFullscreen.disabled = isFull;
            exitFullscreen.disabled = !isFull;
        }

        enterFullscreen.addEventListener('click', async () => {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            }
        });

        exitFullscreen.addEventListener('click', async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', syncOSScreenControls);

        // Keyboard escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const openWin = document.querySelector('.window.open');
                if (openWin) closeWindow(openWin);
            }
        });
    </script>
